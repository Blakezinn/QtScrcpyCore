name: Windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: win64_msvc2019_64
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure standalone harness
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/harness | Out-Null
          @'
          cmake_minimum_required(VERSION 3.19)
          project(CoreBaseline LANGUAGES CXX)
          add_subdirectory(../.. core)
          '@ | Set-Content out/harness/CMakeLists.txt
          cmake -S out/harness -B out/build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DQT_DESIRED_VERSION=5 "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" "-DQSC_DEPLOY_PATH=$pwd/out/deploy"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build out/build --parallel 8
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: QtScrcpyCore-windows-x64
          path: out/deploy/
          if-no-files-found: error
